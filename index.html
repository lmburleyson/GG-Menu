/* Layout: sticky app bar with Stock / Edit / Preview tabs. The CLT menu is a fixed 1920x1080 poster with four absolutely placed panels, scaled for preview and rendered at full size for the PNG. */
:root {
  --bg: #070612;
  --panel: #100e24;
  --panel2: #181536;
  --line: #2a2650;
  --fg: #f3f1ff;
  --muted: #9a96bd;
  --violet: #9b8cff;
  --gold: #f3c64d;
  --mint: #5fd4b0;
  --danger: #ff6b6b;
  --display: "MenuInter", "Arial Narrow", system-ui, sans-serif;
  --body: "MenuInter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar-in { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: .02em; margin-right: auto; }
.brand small { font-family: var(--body); font-weight: 600; font-size: 11px; letter-spacing: .14em; color: var(--muted); margin-left: 8px; }
.tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 8px 16px; border-radius: 8px; color: var(--muted); font-weight: 600; font-size: 14px; }
.tab[aria-selected="true"] { background: var(--violet); color: #0d0a24; }
.btn { border: 1px solid var(--line); background: var(--panel2); padding: 9px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--violet); }
.btn.primary { background: var(--gold); color: #1c1503; border-color: var(--gold); }
.btn.primary:disabled { opacity: .6; cursor: wait; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
button:focus-visible, .in:focus-visible, .chip:focus-visible, input:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
.status { width: 100%; font-size: 12.5px; color: var(--muted); min-height: 18px; }
.status.warn { color: var(--gold); }

.wrap { max-width: 1000px; margin: 0 auto; padding-block: 20px 90px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h2.h { font-family: var(--display); font-size: 26px; margin: 0 0 4px; font-weight: 800; }
p.lede { margin: 0 0 18px; color: var(--muted); max-width: 62ch; }

.stk { margin-bottom: 26px; }
.stk-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
.stk-h h3 { margin: 0; font-family: var(--display); font-size: 20px; font-weight: 800; }
.stk-h .ct { color: var(--muted); font-size: 13px; margin-right: auto; font-variant-numeric: tabular-nums; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; gap: 10px; text-align: left; min-width: 0; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
.chip .d { flex: none; width: 12px; height: 12px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 3px rgba(95, 212, 176, .18); }
.chip .t { min-width: 0; display: flex; flex-direction: column; }
.chip b { font-weight: 600; overflow-wrap: anywhere; }
.chip span.k { font-size: 12px; color: var(--muted); }
.chip span.k.dl { color: var(--gold); }
.chip.out { background: transparent; border-style: dashed; }
.chip.out .d { background: transparent; border: 2px solid var(--muted); box-shadow: none; }
.chip.out b { color: var(--muted); text-decoration: line-through; }
.chip.out span.k { color: var(--danger); }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.card-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.card-h .in.ti { flex: 1 1 200px; font-family: var(--display); font-weight: 800; font-size: 20px; }
.in { background: #0b0920; border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 9px 10px; font: inherit; font-size: 14px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 14px; }
.lab { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; min-width: 0; }
.lab .in { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--fg); }
.sub-h { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 0 8px; display: flex; align-items: center; gap: 10px; }
.sub-h .sp { margin-left: auto; display: flex; gap: 6px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
.row .in.nm { flex: 2 1 150px; }
.row .in.ds { flex: 3 1 170px; }
.row .in.pr { flex: 0 0 100px; }
.row .in.q { flex: 0 0 70px; }
.row .in.p { flex: 0 0 100px; }
.row .in.n { flex: 1 1 140px; }
.sw { flex: 0 0 92px; border-radius: 999px; padding: 8px 0; font-size: 12.5px; font-weight: 600; border: 1px solid; text-align: center; }
.sw.on { background: rgba(95, 212, 176, .14); border-color: var(--mint); color: var(--mint); }
.sw.off { background: transparent; border-color: var(--muted); color: var(--muted); }
.x { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 8px 10px; color: var(--muted); font-size: 13px; }
.x:hover { color: var(--danger); border-color: var(--danger); }
.x[data-armed] { color: #fff; background: var(--danger); border-color: var(--danger); }

.pv { position: relative; width: 100%; overflow: hidden; border-radius: 12px; border: 1px solid var(--line); }
.pv > .poster { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(4, 3, 12, .86); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 16px; overflow: auto; }
.modal img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); }
.modal p { margin: 0; color: var(--muted); max-width: 52ch; text-align: center; }

/* ---------- the TV poster: 1920 x 1080 ---------- */
.poster { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: #fff; font-family: "MenuInter", system-ui, sans-serif;
  background:
    radial-gradient(ellipse 760px 420px at 6% 0%, rgba(96, 64, 190, .42), rgba(96, 64, 190, 0) 70%),
    radial-gradient(ellipse 640px 360px at 100% 4%, rgba(30, 70, 140, .36), rgba(30, 70, 140, 0) 70%),
    radial-gradient(ellipse 760px 300px at 62% 104%, rgba(70, 150, 96, .34), rgba(70, 150, 96, 0) 70%),
    radial-gradient(ellipse 520px 360px at 0% 100%, rgba(40, 60, 150, .34), rgba(40, 60, 150, 0) 70%),
    #090a1d; }
.poster .logo { position: absolute; left: 16px; top: 14px; width: 92px; height: 52px; }
.poster .hd { position: absolute; left: 117px; top: 17px; }
.poster .hd .th { font-size: 11px; font-weight: 600; letter-spacing: .32em; color: #9c8bff; line-height: 1; }
.poster .hd h1 { margin: 4px 0 0; font-family: "MenuInter", "Arial Narrow", sans-serif; font-weight: 800; font-size: 32px; line-height: 1.05; letter-spacing: -.01em; }

  function banners(sec) {
    return sec.items.filter(dealOn).map(function (i) {
      return '<div class="bn"><span class="pl gd">Discounted</span><span class="bnm">' + esc(i.name) + '</span><span class="bpr">' + esc(money(i.deal)) + (sec.unit ? "<small>" + esc(sec.unit) + "</small>" : "") + "</span></div>";
    }).join("");
  }
  function photoStyle(i) { return i.photo && PHOTOS[i.photo] ? ' style="background-image:url(' + PHOTOS[i.photo] + ')"' : ""; }
  function secHTML(sec) {
    var h = "";
    if (sec.kind === "photos2") {
      h = '<div class="sec grow">' + hdr(sec) + '<div class="ph2">' + sec.items.map(function (i) {
        return '<div class="pc' + (i.out ? " out" : "") + '"><div class="ph' + (i.photo ? "" : " none") + '"' + photoStyle(i) + '></div><div class="lb"><b>' + esc(i.name) + "</b>" + (i.desc ? "<span>" + esc(i.desc) + "</span>" : "") + (i.out ? '<span class="pl so">Sold out</span>' : "") + "</div></div>";
      }).join("") + "</div>" + (sec.footer ? '<div class="ft">' + esc(sec.footer) + "</div>" : "") + "</div>";
    } else if (sec.kind === "list") {
      h = '<div class="sec grow">' + hdr(sec) + ladder(sec) + banners(sec) + '<ul class="lst">' + inFirst(sec.items).map(function (i) {
        return '<li class="' + (i.out ? "out" : "") + '"><span class="nm">' + esc(i.name) + "</span>" + (i.out ? '<span class="pl so">Sold out</span>' : dealOn(i) ? '<span class="pl gd">Discounted</span>' : "") + "</li>";
      }).join("") + "</ul></div>";
    } else if (sec.kind === "grid2") {
      h = '<div class="sec">' + hdr(sec) + ladder(sec) + banners(sec) + '<div class="g2">' + inFirst(sec.items).map(function (i) {
        return '<div class="c' + (i.out ? " out" : dealOn(i) ? " dl" : "") + '"><span class="nm">' + esc(i.name) + "</span>" + (i.out ? '<span class="pl so">Sold out</span>' : dealOn(i) ? '<span class="pl gd">Discounted</span>' : "") + "</div>";
      }).join("") + "</div></div>";
    } else {
      h = '<div class="div"></div><div class="sec grow">' + hdr(sec) + ladder(sec) + '<div class="ph3">' + sec.items.map(function (i) {
        return '<div class="pc' + (i.out ? " out" : "") + '"><div class="ph' + (i.photo ? "" : " none") + '"' + photoStyle(i) + '></div><div class="lb"><b>' + esc(i.name) + "</b>" + (i.out ? '<span class="pl so">Sold out</span>' : "") + "</div></div>";
      }).join("") + "</div></div>";
    }
    return h;
  }
  function posterHTML(s) {
    var panels = PANELS.map(function (p, idx) {
      var body = s.sections.filter(function (x) { return x.panel === idx; }).map(secHTML).join("");
      return '<div class="pn ' + p.cls + '" style="left:' + p.x + "px;width:" + p.w + 'px">' + body + "</div>";
    }).join("");
    return '<div class="poster"><img class="logo" alt="" src="' + LOGO + '"><div class="hd"><div class="th">THCA</div><h1>' + esc(s.heading) + "</h1></div>" + panels + "</div>";
  }
  function viewPreview() {
    return '<h2 class="h">Preview</h2><p class="lede">This is the PNG you will get: 1920 by 1080, the same size as the file on the TVs.</p><div class="pv" id="pvBox">' + posterHTML(state) + "</div>";
  }
  function fitPreview() {
    var box = $("#pvBox"); if (!box) return;
    var p = box.firstElementChild; if (!p) return;
    var sc = box.clientWidth / 1920;
    p.style.transform = "scale(" + sc + ")";
    box.style.height = Math.ceil(1080 * sc) + "px";
  }
  function render() {
    renderTabs();
    $("#view").innerHTML = tab === "stock" ? viewStock() : tab === "edit" ? viewEdit() : viewPreview();
    if (tab === "preview") { fitPreview(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitPreview); }
  }

  /* ---------- saving (this computer only) ---------- */
  function touch() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); setStatus("Saved on this computer"); }
    catch (e) { setStatus("Could not save in this browser. Use Save data to keep a copy.", true); }
  }
  function saveBlob(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
  }
  function stamp() { var d = new Date(), p = function (n) { return String(n).padStart(2, "0"); }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
  function saveData() {
    saveBlob(new Blob([JSON.stringify(state)], { type: "application/json" }), "CLT-menu-data-" + stamp() + ".json");
    setStatus("Data file saved. Load it on another computer with Load data.");
  }
  function loadData(file) {
    var r = new FileReader();
    r.onload = function () {
      var next = null; try { next = normalize(JSON.parse(r.result)); } catch (e) {}
      if (!next) { setStatus("That file is not a menu data file.", true); return; }
      state = next; render(); touch(); setStatus("Menu data loaded");
    };
    r.readAsText(file);
  }

  /* ---------- export ---------- */
  function showModal(blob) {
    var url = URL.createObjectURL(blob);
    var m = document.createElement("div"); m.className = "modal"; m.id = "modal";
    m.innerHTML = '<button class="btn" type="button" data-act="closeModal">Close</button><p>Right click the image and choose Save image as.</p><img alt="Exported menu" src="' + url + '">';
    document.body.appendChild(m);
  }
  function exportPng() {
    if (exporting) return;
    exporting = true;
    var btn = $("#exportBtn"); btn.disabled = true; btn.textContent = "Rendering…";
    var holder = document.createElement("div");
    holder.innerHTML = posterHTML(state);
    var xhtml = new XMLSerializer().serializeToString(holder.firstElementChild);
    var css = document.getElementById("appCss").textContent.replace(/&/g, "&amp;").replace(/</g, "&lt;");
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><foreignObject x="0" y="0" width="1920" height="1080">' +
      '<div xmlns="http://www.w3.org/1999/xhtml"><style>' + css + "</style>" + xhtml + "</div></foreignObject></svg>";
    var img = new Image();
    var done = function () { exporting = false; btn.disabled = false; btn.textContent = "Export PNG"; };
    img.onload = function () {
      setTimeout(function () {
        try {
          var c = document.createElement("canvas"); c.width = 1920; c.height = 1080;
          var ctx = c.getContext("2d"); ctx.fillStyle = "#090a1d"; ctx.fillRect(0, 0, 1920, 1080); ctx.drawImage(img, 0, 0, 1920, 1080);
          c.toBlob(function (b) {
            if (!b) { setStatus("Could not make the image. Try Chrome or Edge.", true); done(); return; }
            saveBlob(b, "CLT-menu-" + stamp() + ".png"); setStatus("PNG exported. Check your Downloads folder.");
            done();
          }, "image/png");
        } catch (e) { setStatus("Could not make the image. Try Chrome or Edge.", true); done(); }
      }, 150);
    };
    img.onerror = function () { setStatus("Could not make the image. Try Chrome or Edge.", true); done(); };
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  /* ---------- events ---------- */
  var armTimers = new WeakMap();
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var act = t.dataset.act;
    if (t.dataset.confirm) {
      if (!t.hasAttribute("data-armed")) {
        t.setAttribute("data-armed", "1"); t.dataset.orig = t.textContent; t.textContent = "Tap again";
        armTimers.set(t, setTimeout(function () { t.removeAttribute("data-armed"); t.textContent = t.dataset.orig; }, 3000));
        return;
      }
      clearTimeout(armTimers.get(t));
    }
    var sec = t.dataset.sid ? findSec(t.dataset.sid) : null;
    var scrollY = window.scrollY, changed = true;
    if (act === "tab") { tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
    else if (act === "export") { exportPng(); return; }
    else if (act === "saveData") { saveData(); return; }
    else if (act === "loadData") { $("#loadFile").click(); return; }
    else if (act === "closeModal") { var m = $("#modal"); if (m) m.remove(); return; }
    else if (act === "toggle" || act === "toggleEdit") { var i = sec && findItem(sec, t.dataset.iid); if (i) i.out = !i.out; }
    else if (act === "allIn" && sec) sec.items.forEach(function (x) { x.out = false; });
    else if (act === "allOut" && sec) sec.items.forEach(function (x) { x.out = true; });
    else if (act === "addItem" && sec) sec.items.push(it("", ""));
    else if (act === "delItem" && sec) sec.items = sec.items.filter(function (x) { return x.id !== t.dataset.iid; });
    else if (act === "addLad" && sec) sec.ladder.push(ld("", "", ""));
    else if (act === "delLad" && sec) sec.ladder = sec.ladder.filter(function (l) { return l.id !== t.dataset.lid; });
    else if (act === "reset") state = makeDefault();
    else changed = false;
    if (!changed) return;
    render(); window.scrollTo(0, scrollY); touch();
    if ((act === "addItem" || act === "addLad") && sec) {
      var f = act === "addItem" ? "name" : "q";
      var rows = document.querySelectorAll('[data-sid="' + sec.id + '"][data-f="' + f + '"]');
      if (rows.length) rows[rows.length - 1].focus();
    }
  });
  function onField(e) {
    var t = e.target; if (!t.dataset || !t.dataset.f) return;
    var val = t.value, k = t.dataset.k, f = t.dataset.f;
    if (k === "set") state[f] = val;
    else {
      var sec = findSec(t.dataset.sid); if (!sec) return;
      if (k === "sec") sec[f] = val;
      else if (k === "item") { var i = findItem(sec, t.dataset.iid); if (i) i[f] = val; }
      else if (k === "lad") { var l = findLad(sec, t.dataset.lid); if (l) l[f] = val; }
    }
    touch();
  }
  document.addEventListener("input", onField);
  document.addEventListener("change", function (e) { if (e.target.id === "loadFile" && e.target.files[0]) { loadData(e.target.files[0]); e.target.value = ""; } });
  window.addEventListener("resize", fitPreview);

  /* ---------- boot ---------- */
  try {
    var saved = localStorage.getItem(LS_KEY);
    if (saved) { var p = normalize(JSON.parse(saved)); if (p) state = p; }
  } catch (e) {}
  render();
  setStatus("Changes are saved on this computer. Use Save data to move them to another one.");
})();
</script>

</body>
</html>
